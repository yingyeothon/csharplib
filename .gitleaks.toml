# gitleaks config (v8 syntax). Default rules plus the credential-assignment rule the
# sibling `service` repo uses, so a leak is caught the same way in both places.
#
# This repository has no infrastructure and needs no credentials: it is seven client
# libraries and their tests. So the rule here is not "redact the secrets we keep" — it
# is "nothing of that shape should ever exist", and every allowlist entry below is a
# test fixture that is obviously not a credential.
title = "yyt csharplib"

[extend]
useDefault = true

[[rules]]
id = "yyt-credential-assignment"
description = "Credential-looking assignment (PASSWORD/SECRET/TOKEN/KEY = long literal on the same line)"
regex = '''(?i)(?:password|secret|token|api[_-]?key|debug[_-]?key)[ \t]*[=:][ \t]*["']?([A-Za-z0-9+/=_\-]{16,})["']?'''
secretGroup = 1
entropy = 3.0
[rules.allowlist]
regexTarget = "line"
regexes = [
  '''(?i)(placeholder|example|changeme|xxx+|\$\{|<[a-z-]+>)''',
  # C# type annotations and members, not values: `string Token`, `Token = token;`.
  '''[=:][ \t]*[A-Za-z_][A-Za-z0-9_]*[ \t]*[;,)]''',
]

# An encrypted asset bundle's key in its text form (the service repository's
# docs/asset-encryption.md): `yak1.` + 43 base64url characters. It ships inside a game,
# never inside this repository. The one allowed value is the conformance-vector key
# (bytes 0123456789abcdef x4) in that form — the service's own rule and allowlist.
[[rules]]
id = "yyt-asset-bundle-key"
description = "Encrypted asset bundle key (yak1.<43 base64url>)"
regex = '''yak1\.[A-Za-z0-9_-]{43}'''
[rules.allowlist]
regexes = ['''yak1\.ASNFZ4mrze8BI0VniavN7wEjRWeJq83vASNFZ4mrze8''']

[allowlist]
description = "Config itself, the deliberately fake token fixture, and the asset conformance vectors"
paths = ['''\.gitleaks\.toml$''']
# GatewayHarness (the base of LobbyHarness and GameHarness) uses
# "eyJ.secret-token.sig": three dot-separated words that look like a JWT to a human
# and are not one. The tests that assert the token never reaches a log line need a
# literal to search for, so it has to be in the source.
# packages/com.yingyeothon.asset-client/Tests/Fixtures/asset-encryption-vectors.json is the
# service's conformance file verbatim: every case's `keyHex` is 0123456789abcdef x4, which
# trips the generic high-entropy rules, and its `key` is that value's yak1 text.
regexes = [
  '''eyJ\.secret-token\.sig''',
  '''\b(0123456789abcdef){4}\b''',
  '''yak1\.ASNFZ4mrze8BI0VniavN7wEjRWeJq83vASNFZ4mrze8''',
]
