name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-docs.sh compares every install URL against the cut tag, and a
          # default checkout has none.
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore Yingyeothon.sln
      - run: dotnet build Yingyeothon.sln -c Release --no-restore
      - run: dotnet format Yingyeothon.sln --verify-no-changes --no-restore
      - run: dotnet test Yingyeothon.sln -c Release --no-build
      - name: Check every package covers itself
        run: ./scripts/check-coverage.sh
      - name: Check the UPM packages stay importable by Unity
        run: ./scripts/validate-packages.sh
      - name: Check the docs link, index and cover the public surface
        run: ./scripts/check-docs.sh

  # This repository is public. The local hooks catch a leak before it is committed,
  # but only on a machine that installed them, so the same scan runs here over the
  # whole history — a leak an older commit carries is still being published.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history, repo config)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --redact --no-banner --config .gitleaks.toml --source .

  # .gitignore does not survive `git add -f`, and a fresh clone is the one place that
  # can prove nothing slipped through on a machine whose hooks were never installed.
  tracked-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .meta, build output or credential-shaped path is tracked
        run: |
          bad=$(git ls-files | grep -a -E \
            '\.meta$|\.received\.[a-z]+$|(^|/)(artifacts|bin|obj|Library|Temp|Logs|UserSettings|Builds)/|(^|/)\.env(\.|$)|(^|/)\.envrc$|^local/' \
            | grep -a -vE '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "tracked paths that must not exist:"; echo "$bad"; exit 1; fi
          echo "tracked paths are clean"
